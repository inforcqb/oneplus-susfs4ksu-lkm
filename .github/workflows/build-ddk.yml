name: build-lkm-ddk

on:
  push:
  workflow_dispatch:

jobs:
  # One .ko per GKI (kernel version × Android release) combination that exists.
  #
  # A module is NOT portable across these: vermagic/KMI differ, and so do the LSM hook
  # prototypes this module hooks by offset.  Every combination the DDK publishes gets its
  # own build and its own artifact, so a device always has a file that matches it.
  #
  #   5.10 → android12-5.10, android13-5.10
  #   5.15 → android13-5.15, android14-5.15
  #   6.1  → android14-6.1                      (kCFI starts here)
  #   6.6  → android15-6.6
  #
  # There is no android14-6.6: Android 14 is 5.15/6.1, Android 15 is 6.6
  # (https://source.android.com/docs/core/architecture/kernel/android-common), and no
  # DDK image exists for that pairing either.  6.12 (Android 16) is deliberately out of
  # scope: `android16-6.12` exists in ACK but no domestic OEM ships it to users yet, and
  # its LSM dispatch (static calls) is a different mechanism.
  #
  # The image tag is pinned to a date on purpose: the same commit rebuilt later must
  # produce the same module.
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
    container:
      # DDK-min image with the GKI kernel headers (modules_prepare done), Module.symvers
      # and the matching Clang toolchain.  KMI freezing guarantees symbol CRCs match the
      # GKI kernel of that release.
      image: ghcr.io/ylarod/ddk-min:${{ matrix.variant }}-20260828
      options: --privileged

    steps:
      - name: Inspect DDK environment
        run: |
          echo "variant  = ${{ matrix.variant }}"
          echo "KDIR=$KDIR"
          echo "KERNEL_SRC=$KERNEL_SRC"
          echo "CLANG_PATH=$CLANG_PATH"
          clang --version | head -1

      - name: Checkout module
        uses: actions/checkout@v4

      # kCFI/CFI checks the callee's type at every indirect call site, and the LSM
      # dispatch calls our replacements indirectly - so a replacement MUST match the hook
      # type EXACTLY (and must not be __nocfi).  Print the authoritative declarations of
      # this tree instead of assuming they match the 5.15 ones: this step is how a hook
      # that changed or disappeared between releases is caught, per variant.
      - name: Show authoritative LSM hook signatures
        run: |
          set -e
          V="${{ matrix.variant }}"
          H=""
          for d in "${KERNEL_SRC:-}" "${KDIR:-}" "/opt/ddk/src/$V" "/opt/ddk/kdir/$V" /opt/ddk/src/* /opt/ddk/kdir/*; do
            if [ -n "$d" ] && [ -f "$d/include/linux/lsm_hooks.h" ]; then H="$d"; break; fi
          done
          if [ -z "$H" ]; then
            echo "::error::no kernel tree with include/linux/lsm_hooks.h found (variant=$V KERNEL_SRC=$KERNEL_SRC KDIR=$KDIR)"
            exit 1
          fi
          echo "=== kernel tree: $H ==="
          DEFS="$H/include/linux/lsm_hook_defs.h"
          [ -f "$DEFS" ] || DEFS="$H/include/linux/lsm_hooks.h"
          echo "=== hook declarations: $DEFS ==="

          # Exactly the hooks this module installs (kernel/sus_path.c).  A missing one is
          # a hard error: the module would not compile against this tree, and a silently
          # dropped hook would read as coverage in the counters.
          HOOKS="inode_permission inode_getattr inode_unlink inode_rmdir inode_rename \
                 inode_link sb_statfs inode_setattr inode_getxattr inode_listxattr \
                 inode_setxattr inode_removexattr path_notify"
          n=0
          for h in $HOOKS; do
            out=$(grep -nE "(^|[^_a-z])${h}," "$DEFS" | head -2 || true)
            if [ -z "$out" ]; then
              echo "::error::hook '$h' is not declared in $DEFS (variant $V)"
              exit 1
            fi
            echo "--- $h ---"; echo "$out"; n=$((n+1))
          done
          echo "checked $n hook prototypes"

          echo "=== the SELinux implementations we target by name ==="
          for s in inode_permission inode_getattr inode_unlink inode_rmdir inode_rename \
                   inode_link sb_statfs inode_setattr inode_getxattr inode_listxattr \
                   inode_setxattr inode_removexattr path_notify; do
            echo "--- selinux_$s ---"
            grep -nA3 "^static int selinux_$s(" "$H/security/selinux/hooks.c" | head -5 || true
          done

          echo "=== the hook list head type (static calls start at 6.12) ==="
          grep -nE 'struct security_hook_heads security_hook_heads|struct lsm_static_calls_table' "$H/security/security.c" | head -3 || true
          echo "=== struct security_hook_list fields (the lsm field changed over releases) ==="
          sed -n '/^struct security_hook_list {/,/} __randomize_layout/p' "$H/include/linux/lsm_hooks.h"

      - name: Show per-version spellings of the non-LSM APIs the module uses
        run: |
          set -e
          V="${{ matrix.variant }}"
          T=""
          for d in "${KERNEL_SRC:-}" "${KDIR:-}" "/opt/ddk/src/$V" "/opt/ddk/kdir/$V" /opt/ddk/src/* /opt/ddk/kdir/*; do
            if [ -n "$d" ] && [ -f "$d/include/linux/lsm_hooks.h" ]; then T="$d"; break; fi
          done
          echo "=== kernel tree: $T ==="
          echo "--- the version this build's LINUX_VERSION_CODE gates are evaluated against ---"
          # The kdir (objtree) is where a prepared tree keeps its generated headers; the
          # src tree may not have them.  version.h is what LINUX_VERSION_CODE expands
          # from, utsrelease.h is the human-readable release.
          G="${KDIR:-$T}/include/generated"
          cat "$G/uapi/linux/version.h" 2>/dev/null || true
          cat "$G/utsrelease.h" 2>/dev/null || cat "$T/include/generated/utsrelease.h" 2>/dev/null || true
          echo "--- inode timestamps (i_ctime became __i_ctime + inode_get_ctime() in 6.6) ---"
          grep -nE 'i_atime;|i_mtime;|_i_ctime;|inode_get_ctime|inode_set_ctime' "$T/include/linux/fs.h" | head -8 || true
          echo "--- the mm's vma container (mm->mmap list before 6.1, mm->mm_mt from 6.1) ---"
          grep -nE 'struct vm_area_struct \*mmap;|struct maple_tree mm_mt;' "$T/include/linux/mm_types.h" || true
          grep -nE '^#define VMA_ITERATOR|^#define for_each_vma' "$T/include/linux/mm_types.h" "$T/include/linux/mm.h" || true
          echo "--- kallsyms_on_each_symbol (its callback lost the struct module * in 6.5) ---"
          grep -nA3 'kallsyms_on_each_symbol' "$T/include/linux/kallsyms.h" | head -12 || true
          echo "--- task_work_add notify modes ---"
          grep -nE 'TWA_RESUME|task_work_add' "$T/include/linux/task_work.h" || true
          echo "--- kvmalloc()/kvfree() ---"
          grep -nE 'void \*kvmalloc\(|void kvfree\(' "$T/include/linux/mm.h" "$T/include/linux/slab.h" || true

      - name: Build susfs_guard_lkm.ko (DDK way)
        run: |
          set -e
          # One line on purpose: trailing backslashes followed by a blank line ended the
          # shell continuation, so this used to run `make -C $KDIR M=.../kernel` with no
          # ARCH/CC/LLVM and no `modules` target (the flags line became a no-op assignment
          # and `modules` was "command not found", masked by the pipe into tail).  It only
          # worked because the image exports ARCH/LLVM - i.e. the build silently depended
          # on the image.
          #
          # -k (keep going) because one broken object used to hide every later one: with
          # plain `make`, the first failure in a parallel wave ends the build, so a variant
          # reported its errors one CI round at a time.  -k still exits nonzero when
          # anything failed - it only changes how much of the failure is reported.
          make -k -C "$KDIR" M="$PWD/kernel" ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules -j"$(nproc)"
          ls -la kernel/susfs_guard_lkm.ko
          file kernel/susfs_guard_lkm.ko

      - name: Verify sections (__versions / .BTF / cfi)
        run: |
          set -e
          f=kernel/susfs_guard_lkm.ko
          readelf -S "$f" | grep -E "__versions|\.BTF|cfi|\.llvm_addrsig|\.plt|modinfo" || true
          echo "--- vermagic ---"
          modinfo "$f" 2>/dev/null | grep -E "vermagic|srcversion" || true
          echo "--- CFI scheme of this tree ---"
          # 5.10/5.15 use LLVM CFI (__cfi_check + shadow + .cfi_jt jump tables); 6.1/6.6
          # use kCFI (a type hash right before the function, checked inline by the caller).
          # The module's symbol resolution differs between the two, so record which one
          # this artifact was built against.
          grep -cE '\.cfi_jt$' /proc/kallsyms 2>/dev/null | sed 's/^/  .cfi_jt symbols in the build container: /' || true
          echo "--- mount-hook symbols this module probes by name ---"
          for s in show_vfsstat show_mountinfo show_vfsmnt; do
            printf '  %-16s %s\n' "$s" "$(grep -cE " $s\$" /proc/kallsyms 2>/dev/null || echo '?')"
          done
          echo "--- KMI version-check state ---"
          # modpost emits CRCs (and srcversion, and a module_layout dependency) only when
          # Module.symvers carries them.  This DDK tree's __versions is empty, so the
          # kernel's check_version() finds no entry for ANY imported symbol and load-time
          # symbol version checking does not happen - i.e. "it loads" is not evidence that
          # the KMI matches.  Fail loudly here rather than let that pass as a green build.
          vs=$(readelf -SW "$f" | awk '/\] __versions/ {print $6}')
          sv=$(readelf -p .modinfo "$f" | grep -c 'srcversion=' || true)
          ml=$(nm -u "$f" | grep -c 'module_layout' || true)
          echo "__versions size=${vs:-?} srcversion=${sv} module_layout=${ml}"
          if [ "${vs:-0}" = "0" ] || [ "${sv:-0}" = "0" ] || [ "${ml:-0}" = "0" ]; then
            echo "::warning::no symbol CRCs in this build tree: load-time version checks are inert (Module.symvers has no CRC entries)"
          fi

      - name: Upload .ko
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm.ko-${{ matrix.variant }}
          path: kernel/susfs_guard_lkm.ko
          if-no-files-found: error

  # The userspace tools are freestanding and kernel-independent, so they are built once
  # rather than six times.  A broken tool FAILS this job on purpose: it is the
  # evidence-gathering half of this project, and a tool that cannot compile or that reads
  # the ABI wrong is how "verified" becomes wrong.
  tools:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android14-6.1-20260828
      options: --privileged
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      # Not part of the module: a freestanding aarch64 client for the supercall commands
      # ksu_susfs does not expose (hide_sus_mnts_for_non_su_procs, add_sus_path_loop).
      - name: Build userspace supercall client
        run: |
          set -e
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_sc tools/susfs_sc.c
          file /tmp/susfs_sc
          ls -la /tmp/susfs_sc

      - name: Upload userspace client
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_sc
          path: /tmp/susfs_sc
          if-no-files-found: warn

      # Micro-benchmark for the syscall layers (same freestanding shape as the client
      # above).  Used to answer "what does the hook cost per call".
      - name: Build syscall micro-benchmark
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_bench tools/susfs_bench.c
          file /tmp/susfs_bench
          ls -la /tmp/susfs_bench

      - name: Upload micro-benchmark
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_bench
          path: /tmp/susfs_bench
          if-no-files-found: warn

      # mmap a file, touch it, then read /proc/self/pagemap and /proc/self/smaps_rollup
      # *in the same process* - a shell cannot do this, because the child that runs dd has
      # its own mm and therefore its own addresses.
      - name: Build mmap/pagemap probe
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_mmap tools/susfs_mmap.c
          file /tmp/susfs_mmap
          ls -la /tmp/susfs_mmap

      - name: Upload mmap/pagemap probe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_mmap
          path: /tmp/susfs_mmap
          if-no-files-found: warn

      # The second door to a hidden mapping's content: /proc/self/mem and
      # process_vm_readv(2), both read by the process that owns the mapping - the only way
      # to tell whether a remote-memory hook actually refuses.
      - name: Build remote-memory probe
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_memrd tools/susfs_memrd.c
          file /tmp/susfs_memrd
          ls -la /tmp/susfs_memrd

      - name: Upload remote-memory probe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_memrd
          path: /tmp/susfs_memrd
          if-no-files-found: warn

      # The detector's view of a hidden mount: the mnt_id that /proc/self/fdinfo/N prints
      # and statx(2) returns, checked against the ids mountinfo lists.
      - name: Build mnt_id cross-check
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_mntid tools/susfs_mntid.c
          file /tmp/susfs_mntid
          ls -la /tmp/susfs_mntid

      - name: Upload mnt_id cross-check
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_mntid
          path: /tmp/susfs_mntid
          if-no-files-found: warn

      # A 32-bit client.  Only a real AArch32 caller can exercise the compat stat path,
      # and the audit showed the module had the compat structure wrong - no 64-bit test
      # could have seen that.
      - name: Build 32-bit compat stat client
        run: |
          set -e
          clang --target=armv7a-linux-androideabi -march=armv7-a -O2 -nostdlib \
                -static-pie -fno-stack-protector -fno-builtin -fuse-ld=lld \
                -Wl,-e,_start -o /tmp/susfs_compat_stat tools/susfs_compat_stat.c
          file /tmp/susfs_compat_stat
          ls -la /tmp/susfs_compat_stat

      - name: Upload 32-bit compat stat client
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_compat_stat
          path: /tmp/susfs_compat_stat
          if-no-files-found: warn

      # The loading half of this project: it loads the .ko on a stock vendor kernel
      # WITHOUT ksud, by rewriting every undefined symbol of the image to
      # st_shndx=SHN_ABS / st_value=<kallsyms address> before init_module(2), so the
      # kernel's SHN_UNDEF branch (resolve_symbol -> export lookup, namespace import,
      # CRC check, KMI whitelist) is never entered at all.  See the source header.
      - name: Build module loader (no-ksud insmod)
        run: |
          set -e
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_insmod tools/susfs_insmod.c
          file /tmp/susfs_insmod
          ls -la /tmp/susfs_insmod

      - name: Upload module loader
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_insmod
          path: /tmp/susfs_insmod
          if-no-files-found: warn
