name: build-lkm-ddk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # DDK-min image with GKI android13-5.15 kernel headers (modules_prepare
      # done), Module.symvers and the matching Clang toolchain.  KMI freezing
      # guarantees symbol CRCs match the GKI kernel.
      image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
      options: --privileged

    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Inspect DDK environment
        run: |
          echo "KDIR=$KDIR"
          echo "KERNEL_SRC=$KERNEL_SRC"
          echo "CLANG_PATH=$CLANG_PATH"
          clang --version | head -1

      # kCFI checks the callee's type hash at the call site, so an LSM hook
      # replacement must match the hook type EXACTLY (and must not be __nocfi).
      # Print the authoritative declarations instead of guessing them.
      - name: Show authoritative LSM hook signatures
        run: |
          H=$KERNEL_SRC/include/linux/lsm_hooks.h
          echo "=== header: $H ==="
          echo "--- inode_permission ---"
          grep -n -B3 -A3 "inode_permission)" "$H" || true
          echo "--- inode_getattr ---"
          grep -n -B2 -A2 "inode_getattr)" "$H" || true
          echo "--- selinux impls ---"
          grep -n -A4 "^static int selinux_inode_permission" "$KERNEL_SRC/security/selinux/hooks.c" || true
          grep -n -A3 "^static int selinux_inode_getattr" "$KERNEL_SRC/security/selinux/hooks.c" || true

      - name: Build susfs_guard_lkm.ko (DDK way)
        run: |
          set -e
          make -C $KDIR M=$PWD/kernel \
               ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
               modules -j$(nproc) 2>&1 | tail -50
          ls -la kernel/susfs_guard_lkm.ko
          ls -la kernel/syscall_test.ko
          ls -la kernel/kstat_probe_test.ko
          file kernel/susfs_guard_lkm.ko
          file kernel/syscall_test.ko
          file kernel/kstat_probe_test.ko

      - name: Build supercall test binary (arm64, no libc)
        run: |
          set -e
          clang --target=aarch64-linux-gnu -static -nostdlib \
                -fuse-ld=lld -o test_sc test_sc.c
          file test_sc
          ls -la test_sc

      - name: Verify sections (__versions / .BTF / cfi)
        run: |
          f=kernel/susfs_guard_lkm.ko
          readelf -S "$f" | grep -E "__versions|\.BTF|cfi|\.llvm_addrsig|\.plt|modinfo" || true
          echo "--- vermagic"
          modinfo "$f" 2>/dev/null | grep -E "vermagic|srcversion" || true
          f=kernel/syscall_test.ko
          readelf -S "$f" | grep -E "__versions|\.BTF|cfi|\.llvm_addrsig|\.plt|modinfo" || true
          echo "--- syscall_test vermagic"
          modinfo "$f" 2>/dev/null | grep -E "vermagic|srcversion" || true

      - name: Upload .ko
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm.ko-ddk
          path: |
            kernel/susfs_guard_lkm.ko
            kernel/syscall_test.ko
            kernel/kstat_probe_test.ko
            kernel/open_probe_test.ko
            kernel/inode_perm_probe_test.ko
            kernel/enoent_probe_test.ko
            kernel/selinux_probe_test.ko
            kernel/selinux_hide_probe.ko
            test_sc
          if-no-files-found: error
