name: build-lkm-ddk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # DDK-min image with GKI android13-5.15 kernel headers (modules_prepare
      # done), Module.symvers and the matching Clang toolchain.  KMI freezing
      # guarantees symbol CRCs match the GKI kernel.
      image: ghcr.io/ylarod/ddk-min:android13-5.15-20260313
      options: --privileged

    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Inspect DDK environment
        run: |
          echo "KDIR=$KDIR"
          echo "KERNEL_SRC=$KERNEL_SRC"
          echo "CLANG_PATH=$CLANG_PATH"
          clang --version | head -1

      # kCFI checks the callee's type hash at the call site, so an LSM hook
      # replacement must match the hook type EXACTLY (and must not be __nocfi).
      # Print the authoritative declarations instead of guessing them.
      - name: Show authoritative LSM hook signatures
        run: |
          H=$KERNEL_SRC/include/linux/lsm_hooks.h
          echo "=== header: $H ==="
          echo "--- inode_permission ---"
          grep -n -B3 -A3 "inode_permission)" "$H" || true
          echo "--- inode_getattr ---"
          grep -n -B2 -A2 "inode_getattr)" "$H" || true
          echo "--- selinux impls ---"
          grep -n -A4 "^static int selinux_inode_permission" "$KERNEL_SRC/security/selinux/hooks.c" || true
          grep -n -A3 "^static int selinux_inode_getattr" "$KERNEL_SRC/security/selinux/hooks.c" || true

      - name: Build susfs_guard_lkm.ko (DDK way)
        run: |
          set -e
          make -C $KDIR M=$PWD/kernel 
               ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 
               modules -j$(nproc) 2>&1 | tail -50
          ls -la kernel/susfs_guard_lkm.ko
          file kernel/susfs_guard_lkm.ko
      - name: Verify sections (__versions / .BTF / cfi)
        run: |
          f=kernel/susfs_guard_lkm.ko
          readelf -S "$f" | grep -E "__versions|\.BTF|cfi|\.llvm_addrsig|\.plt|modinfo" || true
          echo "--- vermagic"
          modinfo "$f" 2>/dev/null | grep -E "vermagic|srcversion" || true

      # Not part of the module: a freestanding aarch64 client for the supercall
      # commands ksu_susfs does not expose (hide_sus_mnts_for_non_su_procs,
      # add_sus_path_loop).  Build failure must not hide the module artifact, so
      # this step is allowed to fail.
      - name: Build userspace supercall client
        continue-on-error: true
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_sc tools/susfs_sc.c
          file /tmp/susfs_sc
          ls -la /tmp/susfs_sc

      - name: Upload .ko
        uses: actions/upload-artifact@v4
        with:
          name: susfs_guard_lkm.ko-ddk
          path: |
            kernel/susfs_guard_lkm.ko
          if-no-files-found: error

      - name: Upload userspace client
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_sc
          path: /tmp/susfs_sc
          if-no-files-found: warn

      # Micro-benchmark for the syscall layers (same freestanding shape as the
      # client above).  Used to answer "what does the hook cost per call".
      - name: Build syscall micro-benchmark
        continue-on-error: true
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_bench tools/susfs_bench.c
          file /tmp/susfs_bench
          ls -la /tmp/susfs_bench

      - name: Upload micro-benchmark
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_bench
          path: /tmp/susfs_bench
          if-no-files-found: warn

      # mmap a file, touch it, then read /proc/self/pagemap and
      # /proc/self/smaps_rollup *in the same process* - a shell cannot do this,
      # because the child that runs dd has its own mm and therefore its own
      # addresses.
      - name: Build mmap/pagemap probe
        continue-on-error: true
        run: |
          clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
                -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
                -o /tmp/susfs_mmap tools/susfs_mmap.c
          file /tmp/susfs_mmap
          ls -la /tmp/susfs_mmap

      - name: Upload mmap/pagemap probe
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: susfs_mmap
          path: /tmp/susfs_mmap
          if-no-files-found: warn
